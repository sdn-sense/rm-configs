---
general:
  ip: "192.5.193.11"
  sitename: NRM_SC26
  webdomain: "https://sense-scinet.nrp-nautilus.io:443"
  prometheus_federate: http://thanos-federate-proxy-service:9099/federate
  prometheus_query: '{instance="nrp-gpu-01.26.scconf.org", service="node-exporter"}'
agent:
  interfaces: [eno7]
  hostname: nrp-gpu-01.26.scconf.org
  noqos: true
eno7:
  port: PortChannel20
  switch: cisco8122_s0
  shared: false
  intf_max: 100000
  allowOvercommit: false
  vlan_range: [300-309, 1795-1799, 2010-2019, 2400-2419, 2900-2901, 3010-3019, 3120-3129, 3605-3609]
qos:
  policy: hostlevel
  qos_params: "mtu 9000 mpu 9000 quantum 200000 burst 300000 cburst 300000 qdisc sfq balanced"
  interfaces:
    eno7:
      master_intf: eno7
